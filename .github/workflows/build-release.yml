name: Build and Release MirthSync Plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build plugin bundle
        run: ./build.sh

      - name: Collect build artifacts
        run: |
          mkdir -p build-artifacts
          cp mirthsync-plugin.zip build-artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirthsync-plugin
          path: build-artifacts/mirthsync-plugin.zip

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: mirthsync-plugin
          path: release

      - name: Generate checksum
        run: |
          cd release
          sha256sum mirthsync-plugin.zip > mirthsync-plugin.zip.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/mirthsync-plugin.zip
            release/mirthsync-plugin.zip.sha256
